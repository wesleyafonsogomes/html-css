<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de iframe</title>
    <style>
        iframe {
            width: 400px;
            height: 400px;
            border: 2px solid black;
            box-shadow: 0px 3px 5px black;
        }
        
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do 
        <iframe src="https://www.cursoemvideo.com" frameborder="0"></iframe>
        para aprender a programar</p>
        <p>O repositório do Guanabara 
            <iframe src="https://gustavoguanabara.github.io" frameborder="0"></iframe>
            também é bem legal</p>
            <p>Podemos entrar no <iframe src="https://www.google.com.br" frameborder="0">
                <a href="https://www.google.com.br" target="_blank">google</a></iframe> também</p>
    
</body>
</html>
